<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  <title>Wordly Dictionary SPA</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div class="wordly-container">
    <h1>📘 SPA Wordly Dictionary</h1>

    <form id="wordly-form">
      <input
        type="text"
        id="wordly-input"
        placeholder="Enter a word..."
        autocomplete="off"
        required
        aria-label="Enter a word to search"
      />
      <button type="submit" aria-label="Search">Search</button>
    </form>

    <!-- Error message -->
    <div id="wordly-error" class="hidden" role="alert" aria-live="assertive"></div>

    <!-- Results -->
    <div id="wordly-result">
      <h2 id="wordly-title"></h2>
      <p id="wordly-phonetic"></p>
      <button id="wordly-audio-btn" class="hidden" aria-label="Play pronunciation">
        🔊 Play Pronunciation
      </button>
      <div id="wordly-definitions"></div>
      <div id="wordly-synonyms"></div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
